<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Sinfxona</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Kirish (Login) Oynasi -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo"><i class="fa-solid fa-graduation-cap"></i></div>
            <h2>Virtual Sinfga Xush Kelibsiz</h2>
            <p>Darsga qo'shilish uchun ismingizni kiriting</p>
            <input type="text" id="username-input" placeholder="Ismingizni yozing..." onkeydown="checkLoginEnter(event)">
            <button class="btn" onclick="joinRoom()">Xonaga Kirish</button>
        </div>
    </div>

    <!-- Asosiy Dars Dashboard Oynasi -->
    <div id="room-screen" class="dashboard-container">
        
        <!-- Chap Sidebar (Navigatsiya) -->
        <aside class="left-nav">
            <div class="brand-logo">V.CLASS</div>
            <div class="nav-links">
                <a href="#" class="nav-icon active" id="nav-home" onclick="switchMainTab('home')" title="Asosiy"><i class="fa-solid fa-house"></i></a>
                <a href="#" class="nav-icon" id="nav-users" onclick="switchMainTab('participants')" title="Ishtirokchilar"><i class="fa-solid fa-users"></i></a>
                <a href="#" class="nav-icon" id="nav-chat" onclick="switchMainTab('chat')" title="Chat"><i class="fa-solid fa-comment"></i></a>
                <a href="#" class="nav-icon" id="nav-settings" onclick="switchMainTab('settings')" title="Sozlamalar"><i class="fa-solid fa-gear"></i></a>
            </div>
            <div class="user-profile-mini">
                <i class="fa-solid fa-user-circle" style="font-size: 28px; color: #a78bfa;"></i>
            </div>
        </aside>

        <!-- Markaziy Ishchi Maydon -->
        <main class="main-workspace">
            
            <!-- Yuqori Header -->
            <header class="top-header">
                <div class="header-title">
                    <h3>Asosiy Dars Xonasi</h3>
                </div>
                <div class="header-right">
                    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-icon" title="Temani o'zgartirish">🌙</button>
                    <div class="user-badge" id="user-display">Foydalanuvchi: Mehmon</div>
                </div>
            </header>

            <!-- 3 Ustunli Asosiy Qism -->
            <div class="workspace-grid">
                
                <!-- 1-Ustun: Chat / Ishtirokchilar -->
                <section class="panel-column sidebar-col">
                    <div class="sidebar-tabs">
                        <button class="tab-btn active" id="btn-tab-chat" onclick="switchTab('chat')">Chat</button>
                        <button class="tab-btn" id="btn-tab-participants" onclick="switchTab('participants')">Ishtirokchilar</button>
                    </div>

                    <!-- Chat Tab -->
                    <div id="chat-tab" class="tab-content-area" style="display: flex;">
                        <div class="chat-box" id="chat-box">
                            <div class="message">
                                <span>Tizim</span> Xonaga xush kelibsiz!
                            </div>
                        </div>
                        <div class="chat-input-area">
                            <input type="text" id="chat-input" placeholder="Xabar yozing..." onkeydown="checkChatEnter(event)">
                            <button class="btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>

                    <!-- Ishtirokchilar Tab -->
                    <div id="participants-tab" class="tab-content-area" style="display: none;">
                        <div class="participants-list" id="participants-list">
                            <!-- Dinamik to'ldiriladi -->
                        </div>
                    </div>
                </section>

                <!-- 2-Ustun: Video Grid va Boshqaruv -->
                <section class="panel-column video-col">
                    <div class="video-container" id="video-grid">
                        <div class="placeholder-text" id="placeholder">
                            <i class="fa-solid fa-video-slash" style="font-size: 36px; margin-bottom: 8px;"></i>
                            <p>Hozircha boshqa ishtirokchilar yo'q</p>
                        </div>
                        <!-- O'zimizning video -->
                        <div class="video-box" id="local-video-box">
                            <video id="local-video" autoplay playsinline muted></video>
                            <span class="video-username" id="local-username-label">Siz</span>
                        </div>
                    </div>

                    <!-- Boshqaruv Paneli -->
                    <div class="controls-bar">
                        <button class="control-btn" id="mic-btn" onclick="toggleMic()"><i class="fa-solid fa-microphone"></i> Mikrofon</button>
                        <button class="control-btn" id="cam-btn" onclick="toggleCam()"><i class="fa-solid fa-video"></i> Kamera</button>
                        <button class="control-btn" id="share-btn" onclick="toggleScreenShare()"><i class="fa-solid fa-desktop"></i> Ekran</button>
                        <button class="control-btn" onclick="rotateVideo()"><i class="fa-solid fa-rotate"></i> Aylantirish</button>
                        <button class="control-btn" id="rec-btn" onclick="toggleRecording()"><i class="fa-solid fa-circle-dot" style="color:var(--danger)"></i> Yozish</button>
                        <button class="control-btn danger-btn" onclick="leaveRoom()"><i class="fa-solid fa-right-from-bracket"></i> Chiqish</button>
                    </div>
                </section>

                <!-- 3-Ustun: Profil Ma'lumotlari -->
                <section class="panel-column profile-col">
                    <div class="profile-card">
                        <div class="profile-avatar">
                            <i class="fa-solid fa-user-graduate"></i>
                        </div>
                        <h3 id="profile-name">Talaba</h3>
                        <p class="profile-role">Fullstack Dasturlash</p>
                    </div>
                    <div class="info-box">
                        <div class="info-row"><span>Holat:</span> <b style="color: #10b981;">Online</b></div>
                        <div class="info-row"><span>Xona:</span> <b>asosiy-xona</b></div>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
